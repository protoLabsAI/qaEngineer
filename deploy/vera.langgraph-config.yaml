# Vera's seed config (config-as-code — copied to the live config ONCE on first
# boot via PROTOAGENT_SEED_CONFIG; operator edits persist in the config volume).
#
# Headless QA reviewer (ADR 0078 Phase D, PROMOTED stage — see pr_reviewer below;
# shadow remains the shipped default for fresh installs). Secrets NEVER live here:
# OPENAI_API_KEY / A2A_AUTH_TOKEN / GH_TOKEN / PR_REVIEWER_WEBHOOK_SECRET all
# arrive via the stack env (Infisical). `model.api_base` is protoAgent's
# in-container default (http://gateway:4000/v1) — not pinned here.

agent:
  name: vera

# A2A agent card identity (protoAgent #570): `name` comes from AGENT_NAME (set in
# the compose), but `description` + `skills` are config-driven here — without them
# the card falls back to the stock template ("protoAgent template… replace this",
# a placeholder `chat` skill). pr-reviewer ships no `register_a2a_skill`, so we
# declare Vera's dispatchable capability ourselves. Skill *behaviour* lives in
# SOUL.md (already covers ad-hoc PR review); this only advertises it to callers.
a2a:
  description: >-
    Vera — the protoLabs fleet's QA engineer. Reviews pull requests through an
    adversarial panel (four LLM finder angles + the protoPatch structural engine)
    with independent verification, and returns formal PASS/WARN/FAIL verdicts.
    A promoted formal gate on her managed repos — a FAIL blocks against terminal
    CI, and approve-on-green promotion is hers; never reviews her own work.
  skills:
    - id: pr_review
      name: Review a pull request
      description: >-
        Review a GitHub PR through the adversarial panel and the protoPatch
        structural engine, verify the findings, and return a formal
        PASS / WARN / FAIL verdict with the findings that drove it.
      tags: [code-review, pull-request, qa, verdict]
      examples:
        - "review https://github.com/protoLabsAI/protoAgent/pull/64"
        - "what's your verdict on PR #42 in protoLabsAI/qaEngineer?"

plugins:
  enabled: [workflows, github, pr-reviewer]

# The verdict surface (github-plugin). Write is required to post reviews; the
# CI-terminal + self-review guards live INSIDE the tools. gh auth = GH_TOKEN env
# (the protoReview identity — must NOT author PRs in the managed repos).
github:
  write: true
  default_repo: ""
  repos: []

# The reviewer machinery. PROMOTED (earned via the three-way eval): a FAIL posts
# as REQUEST_CHANGES against terminal CI, and approve-on-green promotion is hers
# — she is the sole promoter on these repos, so nothing else may promote them
# (two promoters racing is how double-merges happen). Shadow stays the shipped
# default for fresh installs (see protoagent.bundle.yaml); this is Vera's OWN
# deployment.
#
# `repos` EMPTY = "every repo the GitHub App installation covers" (pr-reviewer
# >= v0.27.0). Installing the App is already an explicit, revocable, audited
# grant; a second list here only ever drifted from it, and the drift was silent —
# the repo delivered webhooks and got nothing reviewed. GitHub is the gate now:
# to bring a repo under review, install the App on it; to remove it, uninstall.
#
# Setting a non-empty list still works and NARROWS to it (useful for a staged
# rollout). It is operator state living in the live config volume, not here — set
# it via POST /api/config, since this file only seeds first boot.
pr_reviewer:
  repos: []
  shadow_mode: false
  promotion_owner: true
  default_repo: ""

# External secrets (ADR 0080) — Vera fetches her own runtime secrets from Infisical
# using a UNIVERSAL-AUTH MACHINE IDENTITY, instead of having them injected once at
# `docker compose up` by a human's `infisical run` session.
#
# WHY THIS EXISTS. The injected-at-deploy shape has two silent failure modes, and we
# hit both. (1) A human CLI session expires — on 2026-08-21 ava's had, and the fleet
# watchdogs had been running for two cycles WITHOUT `DISCORD_WEBHOOK_ALERTS`, which
# means every alarm they could have raised would have gone to a log file instead of
# Discord. The guard was disarmed and nothing said so. (2) Injected env is a SNAPSHOT:
# rotate a secret in the vault and the running container keeps the old value until
# someone remembers to recreate it. A machine identity has no session to expire, and
# `refresh_seconds` re-fetches, so rotation propagates on its own.
#
# HOST HAS NO `/api` SUFFIX. The CLI's `--domain` wants `https://secrets.proto-labs.ai/api`;
# this provider appends `/api/v1/...` itself, so the same value here 404s. Verified by
# probing both shapes against the live server (bare host → 401 = endpoint found and
# credentials rejected; with /api → 404).
#
# CREDENTIALS COME FROM ENV, never this file: INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET
# (the provider's `bootstrap_env`). They are also PROTECTED — no fetched value can
# overwrite them, so the identity cannot rotate itself out of existence mid-run.
#
# `required: true` is deliberate. With the secrets moved out of compose, a failed fetch
# means no GitHub App key and no gateway key: she would boot and then fail every review
# for reasons visible only in her own logs. Fail-fast makes it a restart loop the
# healthcheck reports, which is the loud version of the same fact.
#
# NOT hydrated here: `A2A_AUTH_TOKEN`. The operator bearer is how you reach the API to
# FIX a broken secrets connection — putting it behind that connection locks the door
# with the key inside. It stays in compose.
secrets_manager:
  enabled: true
  provider: infisical
  host: https://secrets.proto-labs.ai
  project_id: 8da5101a-4bde-4c9b-a42a-76da1965f2fe
  environment: prod
  path: /
  recursive: true
  refresh_seconds: 300
  required: true
  override_env: false
